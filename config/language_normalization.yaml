# Language normalization map for the v3 YouTube topic treemap.
#
# Procedure applied in scripts/render_treemap_v3.py (raw language_code is never
# mutated; a new language_display column is derived):
#   1. Lowercase + strip the raw code.
#   2. If it matches any cluster_pattern (substring, case-insensitive) -> other_languages_label.
#   3. Otherwise take the base subtag = text before the first '-' or '_'.
#   4. Look the base up under display_to_bases (ISO 639-1 and 639-2/3 aliases
#      collapse to one display name).
#   5. If the base is not found -> other_languages_label.
# After normalization the top-12 real languages by allocated 4-week views are kept;
# every other real language AND every cluster/unknown code is pooled into
# other_languages_label (printed with its view mass at render time).
# NOTE: every code is quoted because YAML would parse bare no/yes/on/off as booleans.

other_languages_label: "Other languages"
undetermined_label: "Undetermined"
top_k_languages: 12

cluster_patterns:
  - "_cluster"
  - "review_cluster"

# display name -> raw base subtags that map to it
display_to_bases:

