# Canonical scaffold for the hierarchy-aware YouTube topic treemap v2.
#
# This represents YouTube topicCategories metadata. It is not a researcher-defined
# content taxonomy. Unknown labels must remain visible as unmapped topics until
# they are deliberately added here.

